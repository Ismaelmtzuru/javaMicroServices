<div class="container mt-4">
  <div class="input-group mb-3">
    <input type="text" [(ngModel)]="claveBuscada" class="form-control" placeholder="Ingresa ID de escuela " aria-describedby="button-addon2">
    <button class="btn btn-primary" (click)="buscarCurso()" type="button" id="button-addon1">
      Buscar
    </button>
    <button class="btn btn-secondary" (click)="regresar()" type="button" id="button-regresar">
      Regresar
    </button>
  </div>
</div>
<div class="card shadow-sm" *ngIf="cursoEncontrado.length > 0">
  <div class="card-header bg-dark text-white">
    Resultado de la búsqueda
  </div>
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th scope="col">ID Escuela</th>
          <th scope="col">Nombre</th>
          <th scope="col">Clave</th>
          <th scope="col">Fecha de Apertura</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let curso of cursoEncontrado">
          <th scope="row">{{ curso.idEscuela }}</th>
          <td>{{ curso.nombre }}</td>
          <td><span class="badge bg-info text-dark">{{ curso.idEscuela }}</span></td>
          <td>{{ curso.fechaInicio | date:'dd/MM/yyyy' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="alert alert-warning mt-3" *ngIf="busquedaRealizada && cursoEncontrado.length == 0">
  No se encontró ningún curso con la clave: <b>{{ utlimaClaveBuscada }}</b>
</div>
