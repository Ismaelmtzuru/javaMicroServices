<div class="container mt-4">
  <div class="input-group mb-3">
    <input type="text" [(ngModel)]="claveBuscada" class="form-control" placeholder="Introduce la clave de la escuela (Ej: ESC-01)" aria-describedby="button-addon2">
    <button class="btn btn-primary" (click)="buscarEscuela()" type="button" id="button-addon1">
      Buscar
    </button>
    <button class="btn btn-secondary" (click)="regresar()" type="button" id="button-regresar">
      Regresar
    </button>
  </div>
</div>
<div class="card shadow-sm" *ngIf="escuelaEncontrada">
  <div class="card-header bg-dark text-white">
    Resultado de la búsqueda
  </div>
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th scope="col">ID Escuela</th>
          <th scope="col">Nombre</th>
          <th scope="col">Clave</th>
          <th scope="col">Fecha de Apertura</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">{{ escuelaEncontrada.idEscuela }}</th>
          <td>{{ escuelaEncontrada.nombre }}</td>
          <td><span class="badge bg-info text-dark">{{ escuelaEncontrada.clave }}</span></td>
          <td>{{ escuelaEncontrada.fechaApertura | date:'dd/MM/yyyy' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="alert alert-warning mt-3" *ngIf="busquedaRealizada && !escuelaEncontrada">
  No se encontró ninguna escuela con la clave: <b>{{ utlimaClaveBuscada }}</b>
</div>
